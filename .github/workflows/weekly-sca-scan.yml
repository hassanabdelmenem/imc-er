# Automated Weekly Dependency Supply Chain Audit (SCA)
name: Weekly Supply Chain Audit (SCA)

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  supply_chain_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Execute npm Audit (SCA Scan)
        run: |
          echo "Running Supply Chain Dependency Audit..."
          npm audit --audit-level=high || echo "::warning::High/Critical dependencies discovered. Review package metadata."

      - name: Check Outdated Dependencies
        run: |
          npm outdated || echo "Checked outdated packages."
