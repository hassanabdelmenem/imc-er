# Originally generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# Deploys each pull request to a temporary Hosting preview channel. Preview
# channels are separate from the live channel — this workflow never touches
# production.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  id-token: write
  checks: write
  contents: read
  pull-requests: write

# One preview deploy per PR; a new push supersedes the previous one.
concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    # Pull requests from forks never reach the deploy step, so an untrusted
    # contributor cannot exfiltrate the Firebase service account. Keep this.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Catches a public/-only edit before it reaches main, where it would
      # deploy green and change nothing. See firebase-hosting-merge.yml.
      - name: Verify dist/ matches public/
        run: node scripts/build-prod.js --check

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMC_ER_MANAGER }}
          projectId: imc-er-manager
