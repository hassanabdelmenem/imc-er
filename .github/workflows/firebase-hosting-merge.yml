# Originally generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# Release path for Hosting: whatever is on `main` is what imc-er-manager
# serves. Nothing should reach the live channel by any other route — see
# SYNC.md.
#
# Scope: HOSTING ONLY. Firestore rules and Remote Config are released by
# firebase-config-deploy.yml.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

# Never let two live deploys overlap. Newer commits win.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Hosting serves dist/, but the source lives in public/. They are
      # separate committed trees, so an edit to public/ that misses dist/
      # deploys green while changing nothing users can see. Fail here instead.
      - name: Verify dist/ matches public/
        run: node scripts/build-prod.js --check

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMC_ER_MANAGER }}
          channelId: live
          projectId: imc-er-manager
